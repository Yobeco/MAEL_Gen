<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lecteur de document</title>
<style>
:root{color-scheme:light;--paper:#fcfcfb;--ink:#202321;--line:#e6e8e5;--float-shadow:0 8px 28px #15201924}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth;background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;margin:0;padding:0}
#stage{position:relative;width:100%;min-height:100vh;overflow:visible;background:var(--paper)}
.page-image{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.zones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.qr-zone{position:absolute;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;touch-action:manipulation;transition:background .18s,border-color .18s,box-shadow .18s}
.qr-zone:hover,.qr-zone:active,.qr-zone:focus-visible{background:#e0ad6330;border-color:#797f78;box-shadow:0 0 0 5px #2222;outline:none}
.page-error{padding:2rem;color:#6e3931;font:14px system-ui,sans-serif}
#pageError[hidden]{display:none}
#floatingNav{position:fixed;z-index:20;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 10px 10px;border:1px solid #eceeeb;border-radius:18px;background:#fff;box-shadow:var(--float-shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.drag-handle{height:16px;margin:-2px 0 6px;display:flex;align-items:center;justify-content:center;cursor:grab;color:#9a9e99;font:12px/1 system-ui;letter-spacing:3px}
.drag-handle:active{cursor:grabbing}
.arrow-grid{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:3px;justify-items:center;align-items:center}
.arrow-button{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:#090a09;color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;box-shadow:0 1px 2px #0002;transition:transform .12s,background .12s}
.arrow-button:hover{background:#303330;transform:scale(1.06)}
.arrow-button:active{transform:scale(.94)}
.arrow-button:focus-visible{outline:3px solid #9ca49b;outline-offset:3px}
.triangle{display:block;width:0;height:0;border-style:solid}
.up .triangle{border-width:0 7px 9px;border-color:transparent transparent #fff}
.down .triangle{border-width:9px 7px 0;border-color:#fff transparent transparent}
.left .triangle{border-width:7px 9px 7px 0;border-color:transparent #fff transparent transparent}
.right .triangle{border-width:7px 0 7px 9px;border-color:transparent transparent transparent #fff}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:2}
.center-mark{grid-column:2;grid-row:2;color:#a7aba6;font-size:10px;line-height:1}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main id="reader" aria-label="Lecteur du document">
<section id="stage" aria-label="Page du document">
<img class="page-image" id="pageImage" alt="Page du document">
<div class="zones" id="zones"></div>
<div class="page-error" id="pageError" hidden></div>
</section>
</main>
<nav id="floatingNav" aria-label="Commandes flottantes de navigation">
<div class="drag-handle" aria-label="Déplacer les commandes" title="Faire glisser pour déplacer">•••</div>
<div class="arrow-grid">
<button class="arrow-button up" id="scrollUp" type="button" aria-label="Défiler vers le haut"><span class="triangle"></span></button>
<button class="arrow-button left" id="prev" type="button" aria-label="Page précédente"><span class="triangle"></span></button>
<span class="center-mark" aria-hidden="true">✥</span>
<button class="arrow-button right" id="next" type="button" aria-label="Page suivante"><span class="triangle"></span></button>
<button class="arrow-button down" id="scrollDown" type="button" aria-label="Défiler vers le bas"><span class="triangle"></span></button>
</div>
</nav>

let pageIndex=0;

function layoutZones(){const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();zones.style.left=(ir.left-sr.left)+'px';zones.style.top=(ir.top-sr.top)+'px';zones.style.width=ir.width+'px';zones.style.height=ir.height+'px'}
function render(){const p=PAGES[pageIndex],err=document.getElementById('pageError');image.hidden=!p.image;err.hidden=!!p.image;err.textContent=p.image?'':(p.error||'Cette page n’a pas pu être rendue.');if(p.image){image.onload=layoutZones;image.src='data:image/avif;base64,'+p.image;image.alt='Page '+(pageIndex+1)}zones.replaceChildren();requestAnimationFrame(()=>{layoutZones();for(const [i,z] of p.zones.entries()){const b=document.createElement('button');b.type='button';b.className='qr-zone';b.setAttribute('aria-label','Code QR '+(i+1));b.dataset.qrIndex=i;b.style.left=(z.x*100)+'%';b.style.top=(z.y*100)+'%';b.style.width=(z.width*100)+'%';b.style.height=(z.height*100)+'%';zones.append(b)}})}

function scrollPage(direction){window.scrollBy({top:direction*Math.max(180,window.innerHeight*.72),behavior:'smooth'})}
document.getElementById('prev').addEventListener('click',()=>change(-1));document.getElementById('next').addEventListener('click',()=>change(1));
document.getElementById('scrollUp').addEventListener('click',()=>scrollPage(-1));document.getElementById('scrollDown').addEventListener('click',()=>scrollPage(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1);if(e.key==='ArrowUp')scrollPage(-1);if(e.key==='ArrowDown')scrollPage(1)});

document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('#floatingNav'))return;const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,lastY:t.clientY,axis:null};},{passive:true});
document.addEventListener('touchmove',e=>{if(!touchStart||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(!touchStart.axis&&Math.max(Math.abs(dx),Math.abs(dy))>10)touchStart.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(touchStart.axis==='y'){e.preventDefault();const step=touchStart.lastY-t.clientY;if(step)window.scrollBy({top:step,behavior:'auto'});touchStart.lastY=t.clientY;}},{passive:false});
document.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y,axis=touchStart.axis;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;if(axis==='x'||(!axis&&Math.abs(dx)>Math.abs(dy)))change(dx<0?1:-1);},{passive:true});
// Draggable floating controller, initially centered close to the bottom edge.
const floating=document.getElementById('floatingNav');let drag=null;
floating.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=floating.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};floating.setPointerCapture(e.pointerId);e.preventDefault()});
floating.addEventListener('pointermove',e=>{if(!drag)return;const r=floating.getBoundingClientRect(),left=Math.max(8,Math.min(innerWidth-r.width-8,drag.left+e.clientX-drag.x)),top=Math.max(8,Math.min(innerHeight-r.height-8,drag.top+e.clientY-drag.y));floating.style.left=left+'px';floating.style.top=top+'px';floating.style.bottom='auto';floating.style.transform='none'});
floating.addEventListener('pointerup',()=>{drag=null});floating.addEventListener('pointercancel',()=>{drag=null});
window.addEventListener('resize',layoutZones);
render();
</script>
