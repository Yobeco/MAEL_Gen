<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lecteur</title>
<style>
:root{color-scheme:light;--paper:#fcfcfb;--ink:#111;--menu-size:42px;--menu-gap:3px;--menu-pad:4px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
main{width:100%;height:100vh;height:100dvh;padding:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;width:100%;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--paper);touch-action:pan-y; -webkit-overflow-scrolling:touch}
.page-image{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:initial;user-select:none;-webkit-user-drag:none}
.zones{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.qr-zone{position:absolute;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;touch-action:manipulation}
.qr-zone:hover,.qr-zone:active,.qr-zone:focus-visible{background:#1112;border-color:#111;outline:none}
.page-error{padding:20px;color:#222;font:14px/1.5 system-ui,sans-serif}
#floatMenu{position:fixed;z-index:1000;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--menu-size));grid-template-rows:repeat(3,var(--menu-size));gap:var(--menu-gap);padding:var(--menu-pad);touch-action:none;user-select:none;-webkit-user-select:none}
.menu-button,.zoom-hub,.zoom-half{padding:0;margin:0;color:#000;background:#fff;border:1.5px solid #111}
.menu-button{width:var(--menu-size);height:var(--menu-size);border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.menu-button:active,.zoom-half:active{background:#e8e8e8}
.menu-button:focus-visible,.zoom-half:focus-visible{outline:2px solid #555;outline-offset:2px}
.arrow{width:0;height:0;border-style:solid}
.arrow.up{border-width:0 8px 10px;border-color:transparent transparent #111}
.arrow.down{border-width:10px 8px 0;border-color:#111 transparent transparent}
.arrow.left{border-width:8px 10px 8px 0;border-color:transparent #111 transparent transparent}
.arrow.right{border-width:8px 0 8px 10px;border-color:transparent transparent transparent #111}
#moveUp{grid-column:2;grid-row:1}#moveLeft{grid-column:1;grid-row:2}#zoomHub{grid-column:2;grid-row:2}#moveRight{grid-column:3;grid-row:2}#moveDown{grid-column:2;grid-row:3}
.zoom-hub{width:var(--menu-size);height:var(--menu-size);border-radius:50%;display:flex;overflow:hidden;touch-action:none;cursor:grab}
.zoom-hub.dragging{cursor:grabbing}
.zoom-half{height:100%;width:50%;border:0;border-radius:0;display:grid;place-items:center;font:700 20px/1 Arial,sans-serif;cursor:pointer;touch-action:none}
.zoom-half+ .zoom-half{border-left:1px solid #111}
@media(max-width:480px){:root{--menu-size:39px;--menu-gap:2px;--menu-pad:3px}}
</style>
</head>
<body>
<main><section id="stage" aria-label="Page du document"><img class="page-image" id="pageImage" alt="Page du document"><div class="zones" id="zones"></div><div class="page-error" id="pageError" hidden></div></section></main>
<div id="floatMenu" aria-label="Commandes du document">
 <button class="menu-button" id="moveUp" type="button" data-action="scroll-up" aria-label="Défiler vers le haut"><span class="arrow up"></span></button>
 <button class="menu-button" id="moveLeft" type="button" data-action="previous" aria-label="Page précédente"><span class="arrow left"></span></button>
 <div class="zoom-hub" id="zoomHub" aria-label="Déplacer ou régler le zoom">
  <button class="zoom-half" type="button" data-action="zoom-in" aria-label="Agrandir">+</button><button class="zoom-half" type="button" data-action="zoom-out" aria-label="Réduire">−</button>
 </div>
 <button class="menu-button" id="moveRight" type="button" data-action="next" aria-label="Page suivante"><span class="arrow right"></span></button>
 <button class="menu-button" id="moveDown" type="button" data-action="scroll-down" aria-label="Défiler vers le bas"><span class="arrow down"></span></button>
</div>
<script>

'use strict';
const PAGES = __PAGES_JSON__;
let pageIndex=0,touchStart=null;
const image=document.getElementById('pageImage'),stage=document.getElementById('stage'),zones=document.getElementById('zones');
function layoutZones(){zones.style.left=image.offsetLeft+'px';zones.style.top=image.offsetTop+'px';zones.style.width=image.offsetWidth+'px';zones.style.height=image.offsetHeight+'px'}
function render(){const p=PAGES[pageIndex],err=document.getElementById('pageError');document.getElementById('current').textContent=String(pageIndex+1);document.getElementById('total').textContent=String(PAGES.length);document.getElementById('prev').disabled=pageIndex===0;document.getElementById('next').disabled=pageIndex===PAGES.length-1;image.hidden=!p.image;err.hidden=!!p.image;err.textContent=p.image?'':(p.error||'Cette page n’a pas pu être rendue.');if(p.image){image.onload=()=>{image.style.width=(image.naturalWidth*zoom)+'px';image.style.height=(image.naturalHeight*zoom)+'px';layoutZones()};image.src='data:image/avif;base64,'+p.image;image.alt='Page '+(pageIndex+1)}zones.replaceChildren();requestAnimationFrame(()=>{layoutZones();for(const [i,z] of p.zones.entries()){const b=document.createElement('button');b.type='button';b.className='qr-zone';b.setAttribute('aria-label','Code QR '+(i+1));b.dataset.qrIndex=i;b.style.left=(z.x*100)+'%';b.style.top=(z.y*100)+'%';b.style.width=(z.width*100)+'%';b.style.height=(z.height*100)+'%';zones.append(b)}})}
function change(d){pageIndex=Math.max(0,Math.min(PAGES.length-1,pageIndex+d));render()}
document.getElementById('prev').addEventListener('click',()=>change(-1));document.getElementById('next').addEventListener('click',()=>change(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});
// Délégation unique des interactions QR, utilisable au clic et au toucher.
zones.addEventListener('click',e=>{const target=e.target.closest('.qr-zone');if(target)console.log('Code QR cliqué',{page:pageIndex+1,qr:Number(target.dataset.qrIndex)+1})});
stage.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchStart===null)return;const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>55)change(delta<0?1:-1);touchStart=null},{passive:true});
window.addEventListener('resize',render);render();

// Contrôles flottants et gestes : seules les interactions sur l'image/stage naviguent.
let zoom=1;
const menu=document.getElementById('floatMenu'),hub=document.getElementById('zoomHub');
function applyZoom(next,anchor){
 const old=zoom;zoom=Math.max(.25,Math.min(5,next));
 if(image.naturalWidth){image.style.width=(image.naturalWidth*zoom)+'px';image.style.height=(image.naturalHeight*zoom)+'px';layoutZones();}
 if(anchor&&old!==zoom){const r=stage.getBoundingClientRect(),fx=anchor.x-r.left,fy=anchor.y-r.top,k=zoom/old;stage.scrollLeft=(stage.scrollLeft+fx)*k-fx;stage.scrollTop=(stage.scrollTop+fy)*k-fy;}
}
function scrollPage(direction){stage.scrollBy({top:direction*Math.max(100,stage.clientHeight*.72),behavior:'smooth'});}
menu.addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 if(Date.now()<(menu.dataset.suppressClickUntil||0)) {e.preventDefault();return;}
 const action=button.dataset.action;
 if(action==='previous')change(-1);else if(action==='next')change(1);
 else if(action==='scroll-up')scrollPage(-1);else if(action==='scroll-down')scrollPage(1);
 else if(action==='zoom-in')applyZoom(zoom*1.2);else if(action==='zoom-out')applyZoom(zoom/1.2);
});
let drag=null;
hub.addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 const r=menu.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false};
 
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;hub.classList.add('dragging');}
 if(drag.moved){const maxX=innerWidth-menu.offsetWidth,maxY=innerHeight-menu.offsetHeight;menu.style.left=Math.max(0,Math.min(maxX,drag.left+dx))+'px';menu.style.top=Math.max(0,Math.min(maxY,drag.top+dy))+'px';menu.style.right='auto';menu.style.bottom='auto';}
});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;if(drag.moved)menu.dataset.suppressClickUntil=String(Date.now()+350);drag=null;hub.classList.remove('dragging');}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
let singleTouch=null,pinch=null;
function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function midpoint(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
stage.addEventListener('touchstart',e=>{
 if(e.target.closest('button,a,input,textarea,select'))return;
 if(e.touches.length===2){singleTouch=null;pinch={distance:Math.max(1,distance(e.touches[0],e.touches[1])),zoom,mid:midpoint(e.touches[0],e.touches[1])};}
 else if(e.touches.length===1)singleTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
stage.addEventListener('touchmove',e=>{
 if(e.touches.length===2){if(!pinch)pinch={distance:Math.max(1,distance(e.touches[0],e.touches[1])),zoom,mid:midpoint(e.touches[0],e.touches[1])};e.preventDefault();applyZoom(pinch.zoom*distance(e.touches[0],e.touches[1])/pinch.distance,midpoint(e.touches[0],e.touches[1]));}
},{passive:false});
stage.addEventListener('touchend',e=>{
 if(pinch){if(e.touches.length<2)pinch=null;singleTouch=null;return;}
 if(singleTouch&&e.changedTouches.length){const t=e.changedTouches[0],dx=t.clientX-singleTouch.x,dy=t.clientY-singleTouch.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)change(dx<0?1:-1);}
 if(e.touches.length===0)singleTouch=null;
},{passive:true});
stage.addEventListener('touchcancel',()=>{singleTouch=null;pinch=null},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.target.closest('button,input,textarea,select'))return;
 if(e.key==='ArrowLeft')change(-1);else if(e.key==='ArrowRight')change(1);
 else if(e.key==='ArrowUp'){e.preventDefault();scrollPage(-1);}else if(e.key==='ArrowDown'){e.preventDefault();scrollPage(1);}
 else if(e.key==='+'||e.key==='=')applyZoom(zoom*1.2);else if(e.key==='-')applyZoom(zoom/1.2);
});
stage.addEventListener('scroll',layoutZones,{passive:true});
window.addEventListener('resize',layoutZones);
</script>

</body></html>
