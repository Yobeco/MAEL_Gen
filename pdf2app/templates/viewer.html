<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAEL · Lecteur PDF</title>
<style>
:root{color-scheme:light;--paper:#fdfdfc;--ink:#202322;--line:#dedfdb;--control:46px;--gap:5px}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Palatino Linotype",serif;overflow:hidden}
main{width:100vw;height:100vh;height:100dvh;margin:0;padding:0}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--paper);touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.page-image{display:block;width:100%;height:auto;max-width:none;max-height:none;margin:0;object-fit:initial;user-select:none;-webkit-user-drag:none}
.page-image.page-sliding{will-change:transform;transition:transform 300ms ease-out}
@media(prefers-reduced-motion:reduce){.page-image.page-sliding{transition:none!important}}
.zones{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.qr-zone{position:absolute;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;touch-action:manipulation}
.qr-zone:hover,.qr-zone:active,.qr-zone:focus-visible{background:#20232215;border-color:#333;outline:none}
.page-error{padding:clamp(20px,5vw,56px);color:#363936;font:15px/1.6 Georgia,"Palatino Linotype",serif}
#floatMenu{position:fixed;z-index:1000;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--control));grid-template-rows:repeat(3,var(--control));gap:var(--gap);padding:5px;border-radius:18px;background:#fdfdfceF;border:1px solid #dedfdb;box-shadow:0 5px 22px #161b181b;backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none}
#floatMenu.collapsed{grid-template-columns:var(--control);grid-template-rows:var(--control);gap:0}
#floatMenu.collapsed>:not(#menuLogo){display:none}
.menu-button,.zoom-hub,.zoom-half{padding:0;margin:0;color:#202322;background:#fff;border:1px solid #c9cbc6}
.menu-button{width:var(--control);height:var(--control);border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,transform .15s}
.menu-button:hover,.zoom-half:hover{background:#f0f1ee;border-color:#8b8e87}
.menu-button:active,.zoom-half:active{background:#e6e8e3;transform:scale(.96)}
.menu-button:disabled{opacity:.35;cursor:not-allowed}
.menu-button:focus-visible,.zoom-half:focus-visible{outline:2px solid #69736d;outline-offset:2px}
.arrow{width:0;height:0;border-style:solid}
.arrow.up{border-width:0 7px 9px;border-color:transparent transparent #303431}
.arrow.down{border-width:9px 7px 0;border-color:#303431 transparent transparent}
.arrow.left{border-width:7px 9px 7px 0;border-color:transparent #303431 transparent transparent}
.arrow.right{border-width:7px 0 7px 9px;border-color:transparent transparent transparent #303431}
#moveUp{grid-column:2;grid-row:1}#moveLeft{grid-column:1;grid-row:2}#zoomHub{grid-column:2;grid-row:2}#moveRight{grid-column:3;grid-row:2}#moveDown{grid-column:2;grid-row:3}
#menuLogo{grid-column:1;grid-row:1;width:40px;height:40px;object-fit:contain;align-self:center;justify-self:center;cursor:pointer;user-select:none;-webkit-user-drag:none}
.zoom-hub{width:var(--control);height:var(--control);border-radius:50%;display:flex;flex-direction:column;overflow:hidden;touch-action:none;cursor:grab;transition:border-color .15s}
.zoom-hub:hover{border-color:#8b8e87}
.zoom-hub.dragging{cursor:grabbing}
.zoom-half{height:50%;width:100%;flex:1 1 50%;border:0;border-radius:0;display:grid;place-items:center;font:600 20px/1 Georgia,serif;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .15s}
#pageIndicator{grid-column:3;grid-row:3;display:grid;place-items:center;color:#000;font:600 15px/1 Arial,sans-serif;white-space:nowrap}
.zoom-half+.zoom-half{border-top:1px solid #dedfdb}
@media(max-width:480px){:root{--control:42px;--gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
const PAGES = __PAGES_JSON__;
let pageIndex=0;
const image=document.getElementById('pageImage'),stage=document.getElementById('stage'),zones=document.getElementById('zones');
let zoom=1;
function imagePosition(){const r=image.getBoundingClientRect(),s=stage.getBoundingClientRect();return{left:r.left-s.left+stage.scrollLeft,top:r.top-s.top+stage.scrollTop}}
function layoutZones(){const pos=imagePosition();zones.style.left=pos.left+'px';zones.style.top=pos.top+'px';zones.style.width=image.offsetWidth+'px';zones.style.height=image.offsetHeight+'px'}
function setImageSize(){if(!image.naturalWidth)return;image.style.width=(Math.max(1,stage.clientWidth)*zoom)+'px';image.style.height='auto';const r=image.getBoundingClientRect();image.style.marginLeft=Math.max(0,(stage.clientWidth-r.width)/2)+'px';image.style.marginTop=Math.max(0,(stage.clientHeight-r.height)/2)+'px';layoutZones()}

function updateNavigationState(){const maxScroll=Math.max(0,stage.scrollHeight-stage.clientHeight),atTop=stage.scrollTop<=2,atBottom=maxScroll<=2||maxScroll-stage.scrollTop<=2;document.getElementById('moveUp').disabled=atTop;document.getElementById('moveDown').disabled=atBottom;document.getElementById('moveLeft').disabled=pageIndex<=0;document.getElementById('moveRight').disabled=pageIndex>=PAGES.length-1}
let activePageTransition=null,pageTransitionSequence=0;
function finishPageTransition(){if(!activePageTransition){image.classList.remove('page-sliding');image.style.transform='';image.style.transition='';image.style.willChange='';return}const t=activePageTransition;activePageTransition=null;clearTimeout(t.timer);if(t.layer)t.layer.remove();image.classList.remove('page-sliding');image.style.transform='';image.style.transition='';image.style.willChange=''}
function preparePageTransition(direction){finishPageTransition();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||image.hidden||!image.naturalWidth)return null;const stageRect=stage.getBoundingClientRect(),imageRect=image.getBoundingClientRect(),layer=document.createElement('div'),oldImage=image.cloneNode(false);layer.style.cssText='position:fixed;left:'+stageRect.left+'px;top:'+stageRect.top+'px;width:'+stage.clientWidth+'px;height:'+stage.clientHeight+'px;overflow:hidden;pointer-events:none;z-index:10';oldImage.removeAttribute('id');oldImage.classList.remove('page-sliding');oldImage.style.cssText='position:absolute;display:block;left:'+(imageRect.left-stageRect.left)+'px;top:'+(imageRect.top-stageRect.top)+'px;width:'+imageRect.width+'px;height:'+imageRect.height+'px;margin:0;max-width:none;max-height:none;object-fit:fill;transform:translateX(0);transition:none;will-change:transform;user-select:none';layer.append(oldImage);document.body.append(layer);const token=++pageTransitionSequence;activePageTransition={token,layer,oldImage,direction,timer:null};image.classList.add('page-sliding');image.style.transition='none';image.style.transform='translateX('+(direction*stage.clientWidth)+'px)';return token}

function change(d){const next=Math.max(0,Math.min(PAGES.length-1,pageIndex+d));if(next===pageIndex)return;const token=preparePageTransition(d);pageIndex=next;zoom=1;render(token)}
function applyZoom(next,anchor){const old=zoom;zoom=Math.max(.25,Math.min(5,next));if(!image.naturalWidth||image.hidden||old===zoom)return;const r=stage.getBoundingClientRect();anchor=anchor||{x:r.left+r.width/2,y:r.top+r.height/2};const before=imagePosition(),scrollX=stage.scrollLeft,scrollY=stage.scrollTop,fx=anchor.x-r.left,fy=anchor.y-r.top;setImageSize();const after=imagePosition(),k=zoom/old;stage.scrollLeft=after.left+(scrollX+fx-before.left)*k-fx;stage.scrollTop=after.top+(scrollY+fy-before.top)*k-fy;updateNavigationState()}
function scrollPage(direction){stage.scrollBy({top:direction*Math.max(100,stage.clientHeight*.72),behavior:'smooth'})}
document.getElementById('floatMenu').addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;if(Date.now()<Number(document.getElementById('floatMenu').dataset.suppressClickUntil||0)){e.preventDefault();return}if(button.disabled)return;const action=button.dataset.action;if(action==='previous')change(-1);else if(action==='next')change(1);else if(action==='scroll-up')scrollPage(-1);else if(action==='scroll-down')scrollPage(1);else if(action==='zoom-in')applyZoom(zoom*1.2);else if(action==='zoom-out')applyZoom(zoom/1.2)});
// Begin dragging only after 5 px. Until then pointer events produce ordinary button clicks.
const menu=document.getElementById('floatMenu'),hub=document.getElementById('zoomHub'),logo=document.getElementById('menuLogo');let drag=null;
function toggleMenu(){const logoRect=logo.getBoundingClientRect();menu.classList.toggle('collapsed');const menuRect=menu.getBoundingClientRect(),nextLogoRect=logo.getBoundingClientRect();let left=logoRect.left-(nextLogoRect.left-menuRect.left),top=logoRect.top-(nextLogoRect.top-menuRect.top);const maxX=Math.max(0,innerWidth-menu.offsetWidth),maxY=Math.max(0,innerHeight-menu.offsetHeight);if(!menu.classList.contains('collapsed')){left=Math.max(0,Math.min(maxX,left));top=Math.max(0,Math.min(maxY,top))}menu.style.left=left+'px';menu.style.top=top+'px';menu.style.right='auto';menu.style.bottom='auto';const expanded=!menu.classList.contains('collapsed');logo.setAttribute('aria-expanded',String(expanded));logo.setAttribute('aria-label',expanded?'Replier le menu':'Déplier le menu');logo.title=expanded?'Replier le menu':'Déplier le menu'}
logo.addEventListener('click',e=>{if(Date.now()<Number(menu.dataset.suppressClickUntil||0)){e.preventDefault();e.stopPropagation();return}toggleMenu()});
logo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMenu()}});
menu.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;if(e.target.closest('button,#pageIndicator'))return;const r=menu.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;hub.classList.add('dragging');try{menu.setPointerCapture(e.pointerId)}catch(_){}}if(drag.moved){const maxX=Math.max(0,innerWidth-menu.offsetWidth),maxY=Math.max(0,innerHeight-menu.offsetHeight);menu.style.left=Math.max(0,Math.min(maxX,drag.left+dx))+'px';menu.style.top=Math.max(0,Math.min(maxY,drag.top+dy))+'px';menu.style.right='auto';menu.style.bottom='auto'}},{capture:true});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;if(drag.moved)menu.dataset.suppressClickUntil=String(Date.now()+350);drag=null;hub.classList.remove('dragging')}
document.addEventListener('pointerup',endDrag,true);document.addEventListener('pointercancel',endDrag,true);
// Native vertical panning is left intact; horizontal swipes navigate and two-finger pinches zoom.
let singleTouch=null,pinch=null;
function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function midpoint(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
function attachGestures(target){target.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#floatMenu,button,a,input,textarea,select'))return;if(e.touches.length===2){singleTouch=null;pinch={distance:Math.max(1,distance(e.touches[0],e.touches[1])),zoom,mid:midpoint(e.touches[0],e.touches[1])}}else if(e.touches.length===1)singleTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});target.addEventListener('touchmove',e=>{if(e.touches.length===2){if(!pinch)pinch={distance:Math.max(1,distance(e.touches[0],e.touches[1])),zoom,mid:midpoint(e.touches[0],e.touches[1])};e.preventDefault();applyZoom(pinch.zoom*distance(e.touches[0],e.touches[1])/pinch.distance,midpoint(e.touches[0],e.touches[1]))}},{passive:false});target.addEventListener('touchend',e=>{if(pinch){if(e.touches.length<2)pinch=null;singleTouch=null;return}if(singleTouch&&e.changedTouches.length){const t=e.changedTouches[0],dx=t.clientX-singleTouch.x,dy=t.clientY-singleTouch.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)change(dx<0?1:-1)}if(e.touches.length===0)singleTouch=null},{passive:true});target.addEventListener('touchcancel',()=>{singleTouch=null;pinch=null},{passive:true})}
attachGestures(stage);
// If a same-origin frame is added later, attach the same gesture handlers to its document.
function attachFrameGestures(){for(const frame of document.querySelectorAll('iframe')){try{const doc=frame.contentDocument;if(doc&&!frame.dataset.gesturesAttached){attachGestures(doc);frame.dataset.gesturesAttached='true'}}catch(_){/* Cross-origin frames cannot be instrumented by the parent. */}}}
document.querySelectorAll('iframe').forEach(frame=>frame.addEventListener('load',()=>{attachFrameGestures();updateNavigationState()}));attachFrameGestures();
zones.addEventListener('click',e=>{const target=e.target.closest('.qr-zone');if(target)console.log('Code QR cliqué',{page:pageIndex+1,qr:Number(target.dataset.qrIndex)+1})});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,input,textarea,select'))return;if(e.key==='ArrowLeft')change(-1);else if(e.key==='ArrowRight')change(1);else if(e.key==='ArrowUp'){e.preventDefault();scrollPage(-1)}else if(e.key==='ArrowDown'){e.preventDefault();scrollPage(1)}else if(e.key==='+'||e.key==='=')applyZoom(zoom*1.2);else if(e.key==='-')applyZoom(zoom/1.2)});
stage.addEventListener('scroll',()=>{layoutZones();updateNavigationState()},{passive:true});window.addEventListener('resize',()=>{setImageSize();updateNavigationState();const maxX=Math.max(0,innerWidth-menu.offsetWidth),maxY=Math.max(0,innerHeight-menu.offsetHeight);if(menu.style.left){menu.style.left=Math.min(maxX,parseFloat(menu.style.left)||0)+'px';menu.style.top=Math.min(maxY,parseFloat(menu.style.top)||0)+'px'}});render();
