<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAEL · Lecteur PDF</title>
<style>
:root{color-scheme:dark;--ink:#e8e4da;--muted:#9a9a90;--accent:#e0ad63;--paper:#f4f0e8;--night:#161a19;--line:#3d4440}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#34423a 0,transparent 48%),var(--night);color:var(--ink);font-family:Georgia,'Palatino Linotype',serif;display:flex;flex-direction:column}.mast{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,68px);font:11px/1.2 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.brand{color:var(--accent);font-weight:700}.edition{color:var(--muted)}main{width:min(100%,1100px);margin:auto;padding:26px clamp(14px,4vw,44px) 18px;flex:1;display:flex;flex-direction:column}.heading{display:flex;align-items:end;justify-content:space-between;margin:0 0 16px}.eyebrow{font:10px ui-monospace,monospace;color:var(--accent);letter-spacing:.18em;text-transform:uppercase}.heading h1{font-size:clamp(23px,3vw,36px);font-weight:400;margin:7px 0 0;letter-spacing:-.03em}.hint{font:12px ui-monospace,monospace;color:var(--muted)}#stage{position:relative;display:grid;place-items:center;flex:1;min-height:320px;max-height:calc(100vh - 215px);overflow:hidden;background:#111513;border:1px solid #35403a;box-shadow:0 24px 65px #0005}.page-image{display:block;max-width:100%;max-height:calc(100vh - 218px);width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}.zones{position:absolute;inset:auto;pointer-events:none}.qr-zone{position:absolute;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;touch-action:manipulation;transition:background .18s,border-color .18s,box-shadow .18s}.qr-zone:hover,.qr-zone:active,.qr-zone:focus-visible{background:#e0ad6330;border-color:#efc981;box-shadow:0 0 0 5px #e0ad631c;outline:none}.controls{height:82px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:17px}.nav{border:1px solid #59615b;color:var(--ink);background:#202623;padding:11px 16px;font:11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}.nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.nav:disabled{opacity:.35;cursor:not-allowed}.count{font:14px ui-monospace,monospace;color:var(--muted)}.count strong{color:var(--paper);font-size:20px;font-weight:400}.foot{padding:0 5vw 15px;text-align:center;color:#747c75;font:10px ui-monospace,monospace;letter-spacing:.08em}.error{color:#f0a18f;font:13px ui-monospace,monospace}
@media(max-width:600px){.mast{height:58px}.edition{display:none}main{padding-top:19px}.hint{display:none}#stage{min-height:260px;max-height:calc(100dvh - 210px)}.page-image{max-height:calc(100dvh - 214px)}.controls{height:70px}.nav{padding:10px 11px;font-size:10px}}
</style></head>
<body><header class="mast"><span class="brand">MAEL / DOCS</span><span class="edition">Lecteur autonome · édition numérique</span></header>
<main><div class="heading"><div><div class="eyebrow">Archive visuelle</div><h1>Document numérisé</h1></div><div class="hint">Touchez une zone QR pour l’identifier</div></div>
<section id="stage" aria-label="Page PDF"><img class="page-image" id="pageImage" alt="Page du document"><div class="zones" id="zones"></div><div class="page-error" id="pageError" hidden></div></section>
<nav class="controls" aria-label="Navigation des pages"><button class="nav" id="prev" type="button">← Précédente</button><span class="count"><strong id="current">1</strong> <span style="color:#657068">/</span> <span id="total">N</span></span><button class="nav" id="next" type="button">Suivante →</button></nav></main>
<footer class="foot">Traitement local · aucun contenu transmis</footer>
<script>
'use strict';
const PAGES = __PAGES_JSON__;
let pageIndex=0,touchStart=null;
const image=document.getElementById('pageImage'),stage=document.getElementById('stage'),zones=document.getElementById('zones');
function layoutZones(){const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();zones.style.left=(ir.left-sr.left)+'px';zones.style.top=(ir.top-sr.top)+'px';zones.style.width=ir.width+'px';zones.style.height=ir.height+'px'}
function render(){const p=PAGES[pageIndex],err=document.getElementById('pageError');document.getElementById('current').textContent=String(pageIndex+1);document.getElementById('total').textContent=String(PAGES.length);document.getElementById('prev').disabled=pageIndex===0;document.getElementById('next').disabled=pageIndex===PAGES.length-1;image.hidden=!p.image;err.hidden=!!p.image;err.textContent=p.image?'':(p.error||'Cette page n’a pas pu être rendue.');if(p.image){image.onload=layoutZones;image.src='data:image/avif;base64,'+p.image;image.alt='Page '+(pageIndex+1)}zones.replaceChildren();requestAnimationFrame(()=>{layoutZones();for(const [i,z] of p.zones.entries()){const b=document.createElement('button');b.type='button';b.className='qr-zone';b.setAttribute('aria-label','Code QR '+(i+1));b.dataset.qrIndex=i;b.style.left=(z.x*100)+'%';b.style.top=(z.y*100)+'%';b.style.width=(z.width*100)+'%';b.style.height=(z.height*100)+'%';zones.append(b)}})}
function change(d){pageIndex=Math.max(0,Math.min(PAGES.length-1,pageIndex+d));render()}
document.getElementById('prev').addEventListener('click',()=>change(-1));document.getElementById('next').addEventListener('click',()=>change(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});
// Délégation unique des interactions QR, utilisable au clic et au toucher.
zones.addEventListener('click',e=>{const target=e.target.closest('.qr-zone');if(target)console.log('Code QR cliqué',{page:pageIndex+1,qr:Number(target.dataset.qrIndex)+1})});
stage.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchStart===null)return;const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>55)change(delta<0?1:-1);touchStart=null},{passive:true});
window.addEventListener('resize',render);render();
</script></body></html>
