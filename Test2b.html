<head>

<title>MAEL · Lecteur PDF</title>
<style>
:root{color-scheme:light;--paper:#fdfdfc;--ink:#202322;--line:#dedfdb;--control:46px;--gap:5px}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Palatino Linotype",serif;overflow:hidden}
main{width:100vw;height:100vh;height:100dvh;margin:0;padding:0}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--paper);touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.page-image{display:block;width:100%;height:auto;max-width:none;max-height:none;margin:0;object-fit:initial;user-select:none;-webkit-user-drag:none}
.page-image.page-sliding{will-change:transform;transition:transform 300ms ease-out}
@media(prefers-reduced-motion:reduce){.page-image.page-sliding{transition:none!important}}
.zones{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.qr-zone{position:absolute;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;touch-action:manipulation}
.qr-zone:hover,.qr-zone:active,.qr-zone:focus-visible{background:#20232215;border-color:#333;outline:none}
.page-error{padding:clamp(20px,5vw,56px);color:#363936;font:15px/1.6 Georgia,"Palatino Linotype",serif}
#floatMenu{position:fixed;z-index:1000;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--control));grid-template-rows:repeat(3,var(--control));gap:var(--gap);padding:5px;border-radius:18px;background:#fdfdfceF;border:1px solid #dedfdb;box-shadow:0 5px 22px #161b181b;backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none}
#floatMenu.collapsed{grid-template-columns:var(--control);grid-template-rows:var(--control);gap:0}
#floatMenu.collapsed>:not(#menuLogo){display:none}
.menu-button,.zoom-hub,.zoom-half{padding:0;margin:0;color:#202322;background:#fff;border:1px solid #c9cbc6}
.menu-button{width:var(--control);height:var(--control);border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,transform .15s}
.menu-button:hover,.zoom-half:hover{background:#f0f1ee;border-color:#8b8e87}
.menu-button:active,.zoom-half:active{background:#e6e8e3;transform:scale(.96)}
.menu-button:disabled{opacity:.35;cursor:not-allowed}
.menu-button:focus-visible,.zoom-half:focus-visible{outline:2px solid #69736d;outline-offset:2px}
.arrow{width:0;height:0;border-style:solid}
.arrow.up{border-width:0 7px 9px;border-color:transparent transparent #303431}
.arrow.down{border-width:9px 7px 0;border-color:#303431 transparent transparent}
.arrow.left{border-width:7px 9px 7px 0;border-color:transparent #303431 transparent transparent}
.arrow.right{border-width:7px 0 7px 9px;border-color:transparent transparent transparent #303431}
#moveUp{grid-column:2;grid-row:1}#moveLeft{grid-column:1;grid-row:2}#zoomHub{grid-column:2;grid-row:2}#moveRight{grid-column:3;grid-row:2}#moveDown{grid-column:2;grid-row:3}
#menuLogo{grid-column:1;grid-row:1;width:40px;height:40px;object-fit:contain;align-self:center;justify-self:center;cursor:pointer;user-select:none;-webkit-user-drag:none}
.zoom-hub{width:var(--control);height:var(--control);border-radius:50%;display:flex;flex-direction:column;overflow:hidden;touch-action:none;cursor:grab;transition:border-color .15s}
.zoom-hub:hover{border-color:#8b8e87}
.zoom-hub.dragging{cursor:grabbing}
.zoom-half{height:50%;width:100%;flex:1 1 50%;border:0;border-radius:0;display:grid;place-items:center;font:600 20px/1 Georgia,serif;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .15s}
#pageIndicator{grid-column:3;grid-row:3;display:grid;place-items:center;color:#000;font:600 15px/1 Arial,sans-serif;white-space:nowrap}
.zoom-half+.zoom-half{border-top:1px solid #dedfdb}
@media(max-width:480px){:root{--control:42px;--gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
