let pageIndex=0,touchStart=null;
const image=document.getElementById('pageImage'),stage=document.getElementById('stage'),zones=document.getElementById('zones');
function layoutZones(){const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();zones.style.left=(ir.left-sr.left)+'px';zones.style.top=(ir.top-sr.top)+'px';zones.style.width=ir.width+'px';zones.style.height=ir.height+'px'}
function render(){const p=PAGES[pageIndex],err=document.getElementById('pageError');document.getElementById('current').textContent=String(pageIndex+1);document.getElementById('total').textContent=String(PAGES.length);document.getElementById('prev').disabled=pageIndex===0;document.getElementById('next').disabled=pageIndex===PAGES.length-1;image.hidden=!p.image;err.hidden=!!p.image;err.textContent=p.image?'':(p.error||'Cette page n’a pas pu être rendue.');if(p.image){image.onload=layoutZones;image.src='data:image/avif;base64,'+p.image;image.alt='Page '+(pageIndex+1)}zones.replaceChildren();requestAnimationFrame(()=>{layoutZones();for(const [i,z] of p.zones.entries()){const b=document.createElement('button');b.type='button';b.className='qr-zone';b.setAttribute('aria-label','Code QR '+(i+1));b.dataset.qrIndex=i;b.style.left=(z.x*100)+'%';b.style.top=(z.y*100)+'%';b.style.width=(z.width*100)+'%';b.style.height=(z.height*100)+'%';zones.append(b)}})}
function change(d){pageIndex=Math.max(0,Math.min(PAGES.length-1,pageIndex+d));render()}
document.getElementById('prev').addEventListener('click',()=>change(-1));document.getElementById('next').addEventListener('click',()=>change(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});
// Délégation unique des interactions QR, utilisable au clic et au toucher.
zones.addEventListener('click',e=>{const target=e.target.closest('.qr-zone');if(target)console.log('Code QR cliqué',{page:pageIndex+1,qr:Number(target.dataset.qrIndex)+1})});
stage.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchStart===null)return;const delta=e.changedTouches[0].clientX-touchStart;if(Math.abs(delta)>55)change(delta<0?1:-1);touchStart=null},{passive:true});
window.addEventListener('resize',render);render();
